<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img">
<title>Enforcement Flow — Three checkpoints and outcomes</title>
<desc>Sequence of decisions for one agent action through native permission, plugin workflow guard, and final linter verification.</desc>
<rect width="1000" height="760" fill="#0b1020"/>
<rect x="10" y="36" width="980" height="58" rx="10" fill="#0f1730" stroke="#24314f"/>
<rect x="10" y="550" width="980" height="28" rx="10" fill="#0f1730" stroke="#24314f"/>
<text x="18" y="28" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="11">You ask the agent. Agent proposes one action. Checkpoints run in order.</text>
<text x="18" y="568" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="11">Same command + same file + same job + same approval — same prompt, same allow or deny.</text>
<rect x="200" y="60" width="600" height="42" rx="12" fill="#18244a" stroke="#2b3d6b"/>
<text x="500" y="77" fill="#e6ebff" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">Agent proposes: edit file / run command / gh gist edit</text>
<text x="500" y="91" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Picks one workflow first: doc-maintenance, software-delivery, etc.</text>
<rect x="140" y="138" width="720" height="88" rx="14" fill="#102a4a" stroke="#2b5a8a"/>
<text x="500" y="158" fill="#4ea8ff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CHECKPOINT 1 — FRONT DOOR  (opencode.jsonc)</text>
<text x="500" y="176" fill="#e6ebff" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">Is this credential exposure?</text>
<rect x="160" y="184" width="220" height="30" rx="8" fill="#1a0f14" stroke="#ef4444"/>
<text x="270" y="202" fill="#ef4444" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">.env etc. — HARD STOP</text>
<rect x="390" y="184" width="220" height="30" rx="8" fill="#1a1408" stroke="#f59e0b"/>
<text x="500" y="202" fill="#f59e0b" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Gist / git / python / edit — ASK</text>
<rect x="620" y="184" width="220" height="30" rx="8" fill="#0f2416" stroke="#22c55e"/>
<text x="730" y="202" fill="#22c55e" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Safe read (git status, uv) — ALLOW</text>
<path d="M500 226 L500 258" stroke="#4ea8ff" stroke-width="2" marker-end="url(#arr)"/>
<rect x="140" y="268" width="720" height="118" rx="14" fill="#1a274a" stroke="#2b4a7a"/>
<text x="500" y="288" fill="#4ea8ff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CHECKPOINT 2 — WORKFLOW GUARD  (plugins/policy-gate.ts)</text>
<text x="500" y="306" fill="#e6ebff" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">Is this expected for the chosen job?</text>
<text x="500" y="320" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">One job per session. Read-only jobs exist. After first change the job locks. gh gist is now remote-write.</text>
<rect x="160" y="334" width="220" height="34" rx="8" fill="#1a0f14" stroke="#ef4444"/>
<text x="270" y="348" fill="#ef4444" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Credential path — HARD STOP</text>
<text x="270" y="360" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">.env, keys — never asks</text>
<rect x="390" y="334" width="220" height="34" rx="8" fill="#1a1408" stroke="#f59e0b"/>
<text x="500" y="348" fill="#f59e0b" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Otherwise — ASK</text>
<text x="500" y="360" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">Let the front door prompt you</text>
<rect x="620" y="334" width="220" height="34" rx="8" fill="#0f2416" stroke="#22c55e"/>
<text x="730" y="348" fill="#22c55e" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Already approved — ALLOW</text>
<text x="730" y="360" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">One-time approval consumed</text>
<path d="M500 386 L500 418" stroke="#4ea8ff" stroke-width="2"/>
<rect x="240" y="428" width="520" height="40" rx="12" fill="#1b2a4a" stroke="#2b5a8a"/>
<text x="500" y="445" fill="#e6ebff" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">You Allow — action runs (patch / bash / gh gist edit)</text>
<text x="500" y="458" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Recorded as side effect. If you Deny, nothing runs.</text>
<path d="M500 468 L500 492" stroke="#4ea8ff" stroke-width="2"/>
<rect x="140" y="502" width="720" height="40" rx="12" fill="#1a274a" stroke="#2b5a8a"/>
<text x="500" y="520" fill="#4ea8ff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CHECKPOINT 3 — FINAL QUALITY CHECK  (opencode_lint · finish_workflow)</text>
<text x="500" y="534" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Ran only if something changed. Must pass to close the job.</text>
<rect x="160" y="588" width="320" height="72" rx="12" fill="#102a1a" stroke="#1e7a45"/>
<text x="320" y="610" fill="#22c55e" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">IF LINTER PASSES</text>
<text x="320" y="630" fill="#e6ebff" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Job closes. Gist verified.</text>
<text x="320" y="648" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Warnings ok. Errors fixed above.</text>
<rect x="520" y="588" width="320" height="72" rx="12" fill="#1a0f14" stroke="#7a1e1e"/>
<text x="680" y="610" fill="#ef4444" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">IF LINTER FAILS</text>
<text x="680" y="630" fill="#e6ebff" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Blocked. Fix LNT errors.</text>
<text x="680" y="648" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Then re-run finish_workflow.</text>
<text x="500" y="684" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">One rule to remember: Credential exposure is a hard stop. Everything else asks you.</text>
<text x="500" y="698" fill="#7a86a8" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">Change opencode.jsonc or plugins/policy-gate.ts? Quit and restart OpenCode (or /reload). Old session keeps old rules.</text>
<text x="990" y="756" fill="#5b6788" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="end">Scope: one action in a selected workflow. Evidence: ses_fb2102 · fix 06d6e47 · opencode 1.18.25</text>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4ea8ff"/></marker></defs>
</svg>
