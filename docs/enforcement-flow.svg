<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img">
<title>Enforcement Flow — Three checkpoints and outcomes — Policy 2.0.0</title>
<desc>Sequence of decisions for one agent action through workflow selection, native permission front door, policy credential guard, and final linter verification. Policy 2.0.0 native-permissions.</desc>
<rect width="1000" height="760" fill="#0b1020"/>
<rect x="10" y="36" width="980" height="58" rx="10" fill="#0f1730" stroke="#24314f"/>
<rect x="10" y="550" width="980" height="28" rx="10" fill="#0f1730" stroke="#24314f"/>
<text x="18" y="28" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="11">You ask the agent. Agent selects one workflow (select_workflow), then proposes one action. Checkpoints run in order.</text>
<text x="18" y="568" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="11">Same command + same file + same workflow + same approval — same prompt, same allow or deny. policy_health: active, 2.0.0, native-permissions.</text>
<rect x="200" y="60" width="600" height="42" rx="12" fill="#18244a" stroke="#2b3d6b"/>
<text x="500" y="77" fill="#e6ebff" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">Agent proposes: edit file / run command / webfetch / gh api</text>
<text x="500" y="91" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Must call select_workflow first: doc-maintenance, software-delivery, etc. — locks after first side effect</text>
<rect x="140" y="138" width="720" height="88" rx="14" fill="#102a4a" stroke="#2b5a8a"/>
<text x="500" y="158" fill="#4ea8ff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CHECKPOINT 1 — FRONT DOOR  (opencode.jsonc · native permissions)</text>
<text x="500" y="176" fill="#e6ebff" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">Is this credential exposure?</text>
<rect x="160" y="184" width="220" height="30" rx="8" fill="#1a0f14" stroke="#ef4444"/>
<text x="270" y="202" fill="#ef4444" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">.env etc. — HARD STOP</text>
<rect x="390" y="184" width="220" height="30" rx="8" fill="#1a1408" stroke="#f59e0b"/>
<text x="500" y="202" fill="#f59e0b" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">edit / bash / webfetch — ASK</text>
<rect x="620" y="184" width="220" height="30" rx="8" fill="#0f2416" stroke="#22c55e"/>
<text x="730" y="202" fill="#22c55e" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Safe read (17 cmds, glob) — ALLOW</text>
<path d="M500 226 L500 258" stroke="#4ea8ff" stroke-width="2" marker-end="url(#arr)"/>
<rect x="140" y="268" width="720" height="118" rx="14" fill="#1a274a" stroke="#2b4a7a"/>
<text x="500" y="288" fill="#4ea8ff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CHECKPOINT 2 — WORKFLOW + CREDENTIAL GUARD  (plugins/policy-gate.ts 2.0.0)</text>
<text x="500" y="306" fill="#e6ebff" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">Is workflow selected and is path safe?</text>
<text x="500" y="320" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">One workflow per session. After first side effect it locks. Handoff via .agents/handoffs makes source terminal. .env.example never blocks.</text>
<rect x="160" y="334" width="220" height="34" rx="8" fill="#1a0f14" stroke="#ef4444"/>
<text x="270" y="348" fill="#ef4444" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Credential path — HARD STOP</text>
<text x="270" y="360" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">policy-gate: protected credential path blocked</text>
<rect x="390" y="334" width="220" height="34" rx="8" fill="#1a0f14" stroke="#ef4444"/>
<text x="500" y="348" fill="#ef4444" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">No workflow — BLOCK</text>
<text x="500" y="360" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">select_workflow before non-read</text>
<rect x="620" y="334" width="220" height="34" rx="8" fill="#1a1408" stroke="#f59e0b"/>
<text x="730" y="348" fill="#f59e0b" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">With workflow — ASK</text>
<text x="730" y="360" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">Defer to native prompt; approved — ALLOW</text>
<path d="M500 386 L500 418" stroke="#4ea8ff" stroke-width="2"/>
<rect x="240" y="428" width="520" height="40" rx="12" fill="#1b2a4a" stroke="#2b5a8a"/>
<text x="500" y="445" fill="#e6ebff" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">You Allow — action runs (patch / bash / webfetch)</text>
<text x="500" y="458" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Recorded as side effect (stale). If you Deny, nothing runs.</text>
<path d="M500 468 L500 492" stroke="#4ea8ff" stroke-width="2"/>
<rect x="140" y="502" width="720" height="40" rx="12" fill="#1a274a" stroke="#2b5a8a"/>
<text x="500" y="520" fill="#4ea8ff" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CHECKPOINT 3 — FINAL QUALITY CHECK  (opencode_lint · finish_workflow)</text>
<text x="500" y="534" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Runs only if something changed. Must pass to close the workflow.</text>
<rect x="160" y="588" width="320" height="72" rx="12" fill="#102a1a" stroke="#1e7a45"/>
<text x="320" y="610" fill="#22c55e" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">IF LINTER PASSES</text>
<text x="320" y="630" fill="#e6ebff" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Workflow closes. Verification current.</text>
<text x="320" y="648" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Warnings ok. Errors were fixed above.</text>
<rect x="520" y="588" width="320" height="72" rx="12" fill="#1a0f14" stroke="#7a1e1e"/>
<text x="680" y="610" fill="#ef4444" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">IF LINTER FAILS</text>
<text x="680" y="630" fill="#e6ebff" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">Blocked. Fix LNT errors.</text>
<text x="680" y="648" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">Then re-run finish_workflow.</text>
<text x="500" y="684" fill="#9aa3c2" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">One rule to remember: Credential exposure is a hard stop. Everything else asks you via native permissions.</text>
<text x="500" y="698" fill="#7a86a8" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="middle">Change opencode.jsonc or plugins/policy-gate.ts? Quit and restart OpenCode (or /reload). Old session keeps old rules. Do not use OPENCODE_PURE=1.</text>
<text x="990" y="756" fill="#5b6788" font-family="Inter, system-ui, sans-serif" font-size="9" text-anchor="end">Scope: one action in a selected workflow. Evidence: ses_faa14d62fffeIPfKvAWhww8wgD · 4c32673 · policy 2.0.0 native-permissions · opencode 1.18.25 · plugin 1.4.6</text>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4ea8ff"/></marker></defs>
</svg>
