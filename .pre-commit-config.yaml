# Pre-commit hooks - enforces critical rules before commit
# Install: pip install pre-commit && pre-commit install

repos:
  # Ruff - Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Mypy - Type checking (strict for OC005)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        args: [--ignore-missing-imports, --disallow-untyped-defs, --check-untyped-defs]

  # Gitleaks - Secret detection (CRITICAL)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # Hadolint - Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        args: [--ignore, DL3008, --ignore, DL3013]

  # pip-audit - Dependency vulnerability scanning (supply chain)
  # Lightest option: uvx (no permanent install, ~5MB cached binary)
  # Uses PyPI Advisory DB + osv.dev. Scans currently synced packages.
  - repo: local
    hooks:
      - id: pip-audit
        name: Dependency vulnerability scan (pip-audit)
        entry: uvx pip-audit --desc
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # OpenCode Lint - AGENTS.md rules (OC001-OC014 + mock policy)
  # Factory.ai concept: "Linters as Law Enforcement"
  - repo: local
    hooks:
      - id: opencode-lint
        name: OpenCode custom rules (AGENTS.md)
        entry: python -m opencode_lint.cli --pre-commit
        language: system
        files: \.(py|yaml|yml|sh|md)$
        pass_filenames: true
        stages: [pre-commit]

      # Optional: TDD coverage gate (requires pytest-cov)
      # Uncomment to enforce 80% coverage before commit
      # - id: tdd-coverage-gate
      #   name: TDD coverage gate (80% minimum)
      #   entry: pytest --cov --cov-fail-under=80 --cov-report=term-missing
      #   language: system
      #   pass_filenames: false
      #   stages: [pre-commit]
      #   always_run: true
