repos:
  - repo: local
    hooks:
      - id: opencode-lint
        name: opencode-lint
        entry: uv run --no-project python -m opencode_lint.cli --pre-commit
        language: system
        pass_filenames: false
        files: '\.(md|py|ya?ml)$'
        stages: [pre-commit]
        require_serial: true

      - id: ruff-format
        name: ruff-format
        entry: uvx ruff format --check
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-check
        name: ruff-check
        entry: uvx ruff check --select E,W,F,I,S --fix
        language: system
        types: [python]
        stages: [pre-commit]
