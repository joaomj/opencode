[project]
name = "teams-cli"
version = "0.1.0"
description = "Read/write Microsoft Teams messages via Brave browser session tokens"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "typer>=0.15",
    "cryptography>=44.0",
    "rich>=13.0",
]

[project.scripts]
teams-cli = "teams_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teams_cli"]
