[project]
name = "teams-cli"
version = "0.1.0"
description = "Read and send Microsoft Teams messages via local Brave cookies"
readme = "SKILL.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "typer>=0.15",
    "cryptography>=44.0",
    "rich>=13.0",
    "keyring>=25.7.0",
    "websockets>=16.1",
]

[project.scripts]
teams-cli = "teams_cli.main:app"
teams-authd = "teams_cli.authd:main"
teams-authd-status = "teams_cli.status:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teams_cli"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PTH", "RUF"]

[tool.uv]
exclude-newer = "1 week"
