[project]
name = "fetch-x-posts"
version = "0.1.0"
description = "Fetch X posts via XDK and save as markdown"
requires-python = ">=3.11"
dependencies = [
    "xdk>=0.4.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "ERA", "PL", "RUF"]
