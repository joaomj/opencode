[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencode-lint"
version = "1.0.0"
description = "Custom linter for AGENTS.md rules - Factory.ai 'Linters as Law Enforcement' concept"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "OpenCode Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
opencode-lint = "opencode_lint.cli:main"

[project.urls]
Homepage = "https://github.com/joaomj/skills"
Repository = "https://github.com/joaomj/skills"

[tool.hatch.build.targets.wheel]
packages = ["opencode_lint"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "S"]

[tool.uv]
exclude-newer = "1 week"
